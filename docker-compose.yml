version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: mongo
    restart: always
    environment:
      MONGO_INITDB_DATABASE: todos
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  server:
    image: shikhartwo27/mern-todo-server:latest
    container_name: todo-server
    depends_on:
      - mongo
    restart: always
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/todos
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"

  client:
    image: shikhartwo27/mern-todo-client:latest
    container_name: todo-client
    depends_on:
      - server
    restart: always
    environment:
      REACT_APP_API_URL: http://localhost:5000
    ports:
      - "3000:80"

volumes:
  mongo_data:
